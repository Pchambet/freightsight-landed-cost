[project]
name = "freightsight-backend"
version = "0.1.0"
description = "FreightSight API: landed cost allocation and container tracking for SMB importers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "charset-normalizer>=3.4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "openpyxl>=3.1",
    # Pinned to a minor: migration 0005 installs this exact schema and refuses to run against another.
    "procrastinate>=3.9,<3.10",
    "pypdf>=6.18.0",
    "sentry-sdk[fastapi]>=2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.domain.costing.*", "app.domain.imports.parsing", "app.core.settings", "app.core.money"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
