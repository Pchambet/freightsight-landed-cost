name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no push: an advisory published on Tuesday for a locked dependency surfaces by Monday
  # instead of turning the next unrelated push red.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # The event is in the key so that a push to main does not cancel the weekly run, or the reverse.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A scheduled or manual run has no diff to filter on: it checks everything.
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # test_worked_example.py holds this README's worked example to the engine's output.
              - 'README.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fs
          POSTGRES_PASSWORD: fs
          POSTGRES_DB: fs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://fs:fs@localhost:5432/fs_test
      TEST_DATABASE_URL: postgresql+psycopg://fs:fs@localhost:5432/fs_test
      # The runner image ships PostgreSQL 16, and Debian's `pg_dump` wrapper can pick that cluster's
      # client over the 18 installed below: the backup round-trip test skipped for weeks. Named by
      # path; the test now fails in CI (CI=true) instead of skipping.
      PG_DUMP_BIN: /usr/lib/postgresql/18/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
      # pg_dump/pg_restore of the same major as the Postgres service, for the backup round-trip test.
      # Ubuntu's own repositories stop at client 16, hence the PGDG repository.
      - run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # The committed contract is what the front end's types are generated from.
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -rs --cov=app --cov-report=term-missing

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The generated types must be those of the committed contract (backend/openapi.json).
      - run: npm run api:types && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_URL: http://localhost:8001
          # Clerk requires keys at build time since 7.8; these are syntactically valid placeholders.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_placeholder_for_ci_build_only
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # No backend runs here: these smoke tests cover the public pages, which must not need one.
      # Live-format placeholder keys: a pk_test_ key makes Clerk redirect cookie-less browsers to the
      # placeholder Frontend API for a dev-browser handshake, see frontend/playwright.config.ts.
      API_URL: http://127.0.0.1:3199
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_live_placeholder_for_ci_build_only
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Known vulnerabilities in the locked dependencies, apart from the build and test jobs: a new
  # advisory turns this job red, not the verdict on the code that was pushed.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --disable-pip --no-deps
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Production dependencies only: what ships to the browser and the server.
      - run: npm audit --omit=dev
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
